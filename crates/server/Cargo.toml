[package]
name = "port_knockout_server"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "process",] }
toml = "1.1"

port_knockout_protocol = { path = "../protocol" }
